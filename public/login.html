<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Sign in to your Fieldwork Goods account.">
<title>Log In — Fieldwork Goods</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header" id="site-header">
  <div class="header-inner">
    <a href="/index.html" class="brand"><span class="brand-dot"></span>Fieldwork Goods</a>
    <nav class="nav-links" data-auth-slot></nav>
    <a href="/cart.html" class="cart-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>
      </svg>
      Cart <span class="cart-count" data-cart-count style="display:none;">0</span>
    </a>
  </div>
</header>

<main class="form-page">
  <!-- Decorative background image -->
  <div style="position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;">
    <img src="https://images.unsplash.com/photo-1524758631624-e2822e304c36?w=1200&q=60&fit=crop" alt="" style="width:100%;height:100%;object-fit:cover;opacity:0.07;">
  </div>
  <div class="form-card" style="position:relative;z-index:1;">
    <p class="eyebrow">Welcome back</p>
    <h2>Log in</h2>
    <div id="form-error"></div>
    <form id="login-form">
      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button class="btn btn-primary btn-full" type="submit" id="login-submit-btn" style="width:100%;margin-top:8px;">
        Log in
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </form>
    <p class="form-foot">No account? <a href="/register.html">Create one — it's free</a></p>
  </div>
</main>

<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
<script>
window.addEventListener('scroll', () => {
  document.getElementById('site-header').classList.toggle('scrolled', window.scrollY > 40);
}, { passive: true });
</script>
</body>
</html>
