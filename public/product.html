<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="View product details — Fieldwork Goods handcrafted collection.">
<title>Product — Fieldwork Goods</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header" id="site-header">
  <div class="header-inner">
    <a href="/index.html" class="brand">
      <span class="brand-dot"></span>
      Fieldwork Goods
    </a>
    <nav class="nav-links" data-auth-slot></nav>
    <a href="/cart.html" class="cart-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>
      </svg>
      Cart <span class="cart-count" data-cart-count style="display:none;">0</span>
    </a>
  </div>
</header>

<main class="container" id="detail-container" style="padding-top:24px;padding-bottom:96px;">
  <a href="/index.html" style="display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:0.85rem;margin-bottom:8px;transition:color 0.2s;" onmouseover="this.style.color='var(--gold)'" onmouseout="this.style.color='var(--muted)'">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back to Catalog
  </a>
  <p class="muted" style="padding:80px 0;text-align:center;">Loading product…</p>
</main>

<script src="/js/common.js"></script>
<script src="/js/product-detail.js"></script>
<script>
const header = document.getElementById('site-header');
window.addEventListener('scroll', () => {
  header.classList.toggle('scrolled', window.scrollY > 40);
}, { passive: true });
</script>
</body>
</html>
